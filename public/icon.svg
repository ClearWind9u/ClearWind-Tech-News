<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="clearwind-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="100" height="100" rx="28" fill="#0B0E14" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#clearwind-grad)" stroke-width="2" opacity="0.4" />
  
  <!-- ClearWind Dynamic Breeze Symbol -->
  <path d="M26 36 C 36 24, 60 24, 68 34 C 74 42, 70 52, 60 52 C 50 52, 48 44, 56 42" 
        fill="none" stroke="url(#clearwind-grad)" stroke-width="7" stroke-linecap="round" />
        
  <path d="M20 52 C 32 52, 68 52, 76 52 C 84 52, 86 64, 76 66 C 68 68, 66 60, 74 58" 
        fill="none" stroke="url(#accent-grad)" stroke-width="7" stroke-linecap="round" />
        
  <path d="M26 68 C 38 68, 48 68, 54 74 C 58 78, 54 84, 48 84 C 42 84, 40 78, 46 76" 
        fill="none" stroke="url(#clearwind-grad)" stroke-width="7" stroke-linecap="round" />

  <!-- Center Core Star Dot -->
  <circle cx="34" cy="52" r="3.5" fill="#34D399" />
</svg>
