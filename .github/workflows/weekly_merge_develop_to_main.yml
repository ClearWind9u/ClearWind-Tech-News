name: Weekly Auto-Merge (develop -> main)

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (07:00 AM VN Time)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: weekly-release-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js & Verify Build on develop
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Production Build Before Merge
        run: npm run build

      - name: Merge develop into main & Push
        run: |
          echo "Checking out main branch..."
          git checkout main
          git pull origin main

          echo "Merging develop into main..."
          git merge --no-ff develop -m "🚀 release(weekly): automated sync develop -> main [skip ci]"

          echo "Pushing merged changes to main..."
          git push origin main
          echo "Weekly release auto-merge completed successfully!"
