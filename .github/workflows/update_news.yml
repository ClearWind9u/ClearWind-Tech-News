name: Auto Update News Digest (24/7)

on:
  schedule:
    # Runs every 2 hours (00:00, 02:00, 04:00, ... UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: update-news-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch RSS Feeds, Auto-Translate & Save to Database
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-news

      - name: Backup & Commit Changes (Only when using local JSON fallback)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only data/news.json
          git add data/news.json
          
          if git diff --staged --quiet; then
            echo "Database is synchronized. No repository changes needed."
          else
            echo "Local database updated. Discarding extra file changes and committing..."
            # Discard any extra unstaged or untracked changes (e.g. package-lock.json modified by npm)
            git checkout -- .
            git clean -fd
            
            git commit -m "🤖 auto(news): update tech news digest [skip ci]"
            git pull --rebase origin develop
            git push origin develop
            echo "Successfully updated news repository!"
          fi
