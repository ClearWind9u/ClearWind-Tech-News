name: Daily Dead Link Audit & Pruning

on:
  schedule:
    # Runs daily at 20:00 UTC (03:00 AM UTC+7 Vietnam Time)
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: daily-link-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Dead Link Auditor
        run: npm run audit-links

      - name: Commit & Sync Cleaned Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage database and search index
          git add data/news.json data/search-index.json data/archive/
          
          if git diff --staged --quiet; then
            echo "All news links are healthy and accessible. No database changes needed."
          else
            echo "Detected dead links. Pruned and committing updated database..."
            git commit -m "🤖 auto(audit): prune dead/inaccessible articles [skip ci]"
            git pull --rebase origin develop
            git push origin develop
            echo "Successfully synced pruned database to develop!"
          fi
